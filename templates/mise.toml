# Shared Bun monorepo environment for source-template validation and generated
# client workspaces. Source templates use premise-*; generated projects live
# under apps/* or libs/*.

monorepo_root = true

[monorepo]
config_roots = ["premise-*", "apps/*", "libs/*"]

[tools]
bun = "1.4.2"

[tasks.install]
description = "Install every template dependency"
run = "bun install"

[tasks.build]
description = "Build every template"
depends = ["install"]
run = "bun run --filter '*' build"

[tasks.clean]
description = "Remove every template build artifact"
run = '''
find . -type d \( -name dist -o -name .output -o -name .svelte-kit -o -name build -o -name coverage \) -prune -exec rm -rf {} +
'''

[tasks.test]
description = "Run every template test"
depends = ["install"]
run = "bun run --filter '*' test"

[tasks.lint]
description = "Lint and type-check every template"
depends = ["install"]
run = '''
if [ -d premise-commander-cli ] || [ -d apps ] || [ -d libs ]; then
  bun run lint
else
  echo "workspace lint skipped: no projects created yet"
fi
'''

[tasks."lint:fix"]
description = "Fix lint issues, format, and type-check every template"
depends = ["install"]
run = '''
if [ -d premise-commander-cli ] || [ -d apps ] || [ -d libs ]; then
  bun run lint:fix
else
  echo "workspace lint:fix skipped: no projects created yet"
fi
'''

[tasks.format]
description = "Format every template with the shared Prettier policy"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check every template with the shared Prettier policy"
depends = ["install"]
run = "bun run format:check"
