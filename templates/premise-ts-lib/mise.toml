[tools]
bun = "1.4.2"
node = "24"

[tasks.install]
description = "Install Bun dependencies"
run = "bun install"

[tasks.build]
description = "Build the library"
depends = ["install"]
run = "bun run build"

[tasks.clean]
description = "Remove build artifacts"
run = "bun run clean"

[tasks.test]
description = "Run the Bun test suite"
depends = ["install"]
run = "bun run test"

[tasks.lint]
description = "Type-check the library and tests"
depends = ["install"]
run = '''
set -eu
cd "${MISE_MONOREPO_ROOT:-$MISE_PROJECT_ROOT}"
bunx --no-install eslint "$MISE_PROJECT_ROOT" --no-warn-ignored
cd "$MISE_PROJECT_ROOT"
bunx --no-install tsc --noEmit
'''

[tasks."lint:fix"]
description = "Format and type-check the library"
depends = ["install", "format"]
run = '''
set -eu
cd "${MISE_MONOREPO_ROOT:-$MISE_PROJECT_ROOT}"
bunx --no-install eslint "$MISE_PROJECT_ROOT" --fix --no-warn-ignored
cd "$MISE_PROJECT_ROOT"
mise run lint
'''

[tasks.format]
description = "Format project files"
depends = ["install"]
run = '''
set -eu
cd "${MISE_MONOREPO_ROOT:-$MISE_PROJECT_ROOT}"
bunx --no-install prettier --plugin=prettier-plugin-svelte --write "$MISE_PROJECT_ROOT"
'''

[tasks."format:check"]
description = "Check project formatting"
depends = ["install"]
run = '''
set -eu
cd "${MISE_MONOREPO_ROOT:-$MISE_PROJECT_ROOT}"
bunx --no-install prettier --plugin=prettier-plugin-svelte --check "$MISE_PROJECT_ROOT"
'''

[tasks.env-pull]
description = "Pull external environment configuration"
run = 'echo "env-pull: nothing to pull"'

[tasks."publish:rc"]
description = "Skip internal release candidate publication"
run = 'echo "publish:rc: package is internal; nothing to publish"'

[tasks.publish]
description = "Skip internal stable publication"
run = 'echo "publish: package is internal; nothing to publish"'
