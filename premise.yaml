workspace:
  name: premise-bun
  kind: template-registry
  schema-version: "0.1"
  providers:
    ci: github
    tools: mise
    tasks: mise
    infra: none
    versioning: svu
  projects: []
templates:
  - name: premise-commander-cli
    kind: app
    questions:
      - prompt: "CLI name:"
        type: string
        populate: name
    substitutions:
      premise-commander-cli: name
  - name: premise-tanstack-start-app
    kind: app
    questions:
      - prompt: "App name:"
        type: string
        populate: name
    substitutions:
      premise-tanstack-start-app: name
  - name: premise-sveltekit-app
    kind: app
    questions:
      - prompt: "App name:"
        type: string
        populate: name
    substitutions:
      premise-sveltekit-app: name
  - name: premise-opentui-cli
    kind: app
    questions:
      - prompt: "CLI name:"
        type: string
        populate: name
    substitutions:
      premise-opentui-cli: name
  - name: premise-hono-api
    kind: app
    questions:
      - prompt: "API name:"
        type: string
        populate: name
    substitutions:
      premise-hono-api: name
