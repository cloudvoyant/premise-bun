workspace:
  name: premise-bun
  kind: template-registry
  schema-version: '0.2'
  providers:
    ci: github
    tools: mise
    tasks: mise
    infra: none
    versioning: svu
  projects: []
template_registry:
  workspace_files:
    - .gitattributes
    - .gitignore
    - .prettierignore
    - .prettierrc
    - bunfig.toml
    - eslint.config.js
    - package.json
  templates:
    - name: premise-commander-cli
      kind: app
      path: templates/premise-commander-cli
      questions:
        - prompt: 'CLI name:'
          type: string
          populate: name
      substitutions:
        premise-commander: name
    - name: premise-tanstack-start-app
      kind: app
      path: templates/premise-tanstack-start-app
      questions:
        - prompt: 'App name:'
          type: string
          populate: name
      substitutions:
        premise-tanstack-start-app: name
    - name: premise-sveltekit-app
      kind: app
      path: templates/premise-sveltekit-app
      questions:
        - prompt: 'App name:'
          type: string
          populate: name
      substitutions:
        premise-sveltekit-app: name
    - name: premise-opentui-cli
      kind: app
      path: templates/premise-opentui-cli
      questions:
        - prompt: 'CLI name:'
          type: string
          populate: name
      substitutions:
        premise-opentui: name
    - name: premise-hono-api
      kind: app
      path: templates/premise-hono-api
      questions:
        - prompt: 'API name:'
          type: string
          populate: name
      substitutions:
        premise-hono-api: name
