name: On Commit

'on':
  pull_request:
    branches: [master]
  push:
    branches-ignore: [master]

permissions:
  contents: read

concurrency:
  group: publish-rc
  cancel-in-progress: false

jobs:
  verify:
    name: Validate and plan publication
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.release_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Plan publication
        id: plan
        uses: cloudvoyant/premise@v0.4.3
        with:
          command: plan
          flow: on-commit
          release: auto
          install-premise: build
      - name: Run validation
        uses: cloudvoyant/premise@v0.4.3
        with:
          command: flow
          flow: on-commit
          release: none
          install-premise: skip

  publish:
    name: Publish release candidate
    needs: verify
    if: needs.verify.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Check npm credential before creating a release tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo '::error::NPM_TOKEN is unavailable before publication'
            exit 1
          fi
      - name: Create or reuse release tag
        uses: cloudvoyant/premise@v0.4.3
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          command: release
          flow: on-commit
          release: none
          install-premise: build
          channel: rc
          version: ${{ needs.verify.outputs.version }}
      - name: Publish npm packages
        uses: cloudvoyant/premise@v0.4.3
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          command: packages
          flow: on-commit
          release: none
          install-premise: skip
          channel: rc
          version: ${{ needs.verify.outputs.version }}
      - name: Publish GitHub release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release edit "$RELEASE_VERSION" --prerelease --latest=false
          else
            gh release create "$RELEASE_VERSION" --verify-tag --generate-notes --prerelease --latest=false
          fi
