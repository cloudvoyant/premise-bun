---
name: On Commit

"on":
  pull_request:
    branches:
      - master
  push:
    branches-ignore:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Test, lint, and check formatting
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      github.event.before != '0000000000000000000000000000000000000000'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Merge blocker: repin this action to the final merged Premise commit.
      - name: Run on-commit flow
        uses: cloudvoyant/premise@07d50cea0c6eb86d73ea742d49855a57e09bafef
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          flow: on-commit
          release: auto
