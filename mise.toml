# The repository root is a Premise template registry, not a Bun monorepo.
# Shared Bun tooling and aggregate package tasks live under templates/.

[tasks."template-test"]
description = "Run every declared template through the Premise contract"
run = "pm template test"

[tasks.build]
description = "Validate registry structure"
run = '''
set -eu
for file in premise.yaml templates/mise.toml templates/package.json templates/bunfig.toml templates/eslint.config.js templates/.prettierrc templates/.prettierignore; do
  [ -f "$file" ] || { echo "error: missing $file" >&2; exit 1; }
done
echo "registry structure valid"
'''

[tasks.test]
description = "Run the registry contract for every declared template"
run = "mise run template-test"

[tasks.format]
description = "Format registry Mise configuration"
run = "mise fmt"

[tasks."format:check"]
description = "Check registry Mise configuration formatting"
run = "mise fmt --check"

[tasks.lint]
description = "Validate registry configuration"
run = '''
set -eu
mise fmt --check
[ -f premise.yaml ] || { echo "error: missing premise.yaml" >&2; exit 1; }
(cd templates && mise run lint)
echo "registry config valid"
'''

[tasks.clean]
description = "Remove generated Bun artifacts"
run = '''
find templates -type d \( -name node_modules -o -name dist -o -name .output -o -name .svelte-kit -o -name build -o -name coverage \) -prune -exec rm -rf {} +
find templates -name bun.lock -type f -delete
'''
