# The repository root owns registry development and the Bun workspace used by
# source templates. Generated clients receive only the files declared in
# premise.yaml under template_registry.workspace_files.

monorepo_root = true

[monorepo]
config_roots = ["templates/premise-*", "apps/*", "libs/*"]

[tools]
bun = "1.4.2"
node = "24"
svu = "3"

[tasks."on-merge"]
description = "Validate the registry before stable publication"
run = '''
set -eu
mise run format:check
mise run lint
mise run build
mise run test
mise run publish
'''

[tasks."publish:rc"]
description = "Publish Commander and OpenTUI release candidates"
run = '''
set -eu
if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
  npmrc="$(mktemp)"
  trap 'rm -f "$npmrc"' EXIT
  printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$npmrc"
  chmod 600 "$npmrc"
  export NPM_CONFIG_USERCONFIG="$npmrc"
fi
npm whoami >/dev/null
base_tag="$(svu next --tag.pattern 'v*')"
base_version="${base_tag#v}"
identifier="${GITHUB_RUN_NUMBER:-$(date -u +%Y%m%d%H%M%S)}"
version="${base_version}-rc.${identifier}"
for package in premise-commander-cli premise-opentui-cli; do
  (cd "templates/$package" && PREMISE_PUBLISH_VERSION="$version" mise run publish:rc)
done
echo "published CLI release candidates at $version"
'''

[tasks.publish]
description = "Publish stable Commander and OpenTUI packages"
run = '''
set -eu
if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
  npmrc="$(mktemp)"
  trap 'rm -f "$npmrc"' EXIT
  printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$npmrc"
  chmod 600 "$npmrc"
  export NPM_CONFIG_USERCONFIG="$npmrc"
fi
npm whoami >/dev/null
tag="$(svu next --tag.pattern 'v*')"
version="${tag#v}"
for package in premise-commander-cli premise-opentui-cli; do
  (cd "templates/$package" && PREMISE_PUBLISH_VERSION="$version" mise run publish)
done
if git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null; then
  echo "skip: tag $tag already exists"
elif [ "${GITHUB_ACTIONS:-}" = "true" ]; then
  : "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required}"
  : "${GITHUB_SHA:?GITHUB_SHA is required}"
  github_token="${PREMISE_GITHUB_TOKEN:-${GH_TOKEN:-${GITHUB_TOKEN:-}}}"
  : "${github_token:?PREMISE_GITHUB_TOKEN, GH_TOKEN, or GITHUB_TOKEN is required}"
  GH_TOKEN="$github_token" gh api "repos/$GITHUB_REPOSITORY/git/refs" \
    --method POST \
    --field "ref=refs/tags/$tag" \
    --field "sha=$GITHUB_SHA" >/dev/null
else
  git tag -a "$tag" -m "Release $tag"
  git push origin "$tag"
fi
echo "published stable CLI packages at $version"
'''

[tasks."template-test"]
description = "Run every declared template through the Premise contract"
run = "pm template test"

[tasks.build]
description = "Validate registry structure"
run = '''
set -eu
for file in premise.yaml package.json bunfig.toml eslint.config.js .prettierrc .prettierignore .github/workflows/on-commit.yml .github/workflows/on-merge.yml; do
  [ -f "$file" ] || { echo "error: missing $file" >&2; exit 1; }
done
echo "registry structure valid"
'''

[tasks.test]
description = "Run the registry contract for every declared template"
run = "mise run template-test"

[tasks.format]
description = "Format registry and template files"
run = '''
mise fmt
bun run format
'''

[tasks."format:check"]
description = "Check registry and template formatting"
run = '''
mise fmt --check
bun run format:check
'''

[tasks.lint]
description = "Validate registry configuration"
run = '''
set -eu
mise fmt --check
[ -f premise.yaml ] || { echo "error: missing premise.yaml" >&2; exit 1; }
bun run lint
echo "registry config valid"
'''

[tasks.clean]
description = "Remove generated Bun artifacts"
run = '''
find templates apps libs -type d \( -name node_modules -o -name dist -o -name .output -o -name .svelte-kit -o -name build -o -name coverage \) -prune -exec rm -rf {} + 2>/dev/null || true
find templates apps libs -name bun.lock -type f -delete 2>/dev/null || true
'''
