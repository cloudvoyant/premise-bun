# The repository root owns registry development and the Bun workspace used by
# source templates. Generated clients receive only the files declared in
# premise.yaml under template_registry.workspace_files.

monorepo_root = true

[monorepo]
config_roots = ["templates/premise-*", "apps/*", "libs/*"]

[tools]
bun = "1.4.2"
node = "24"
svu = "3"

[tasks."on-merge"]
description = "Validate the registry before stable publication"
run = '''
set -eu
mise run format:check
mise run lint
mise run build
mise run test
'''

# Premise plans tags and selects publishable packages. Template-level publish
# tasks keep ownership of building and uploading their own npm packages.

[tasks."template-test"]
description = "Run every declared template through the Premise contract"
run = "pm template test"

[tasks.build]
description = "Validate registry structure"
run = '''
set -eu
for file in premise.yaml package.json bunfig.toml eslint.config.js .prettierrc .prettierignore .github/workflows/on-commit.yml .github/workflows/on-merge.yml; do
  [ -f "$file" ] || { echo "error: missing $file" >&2; exit 1; }
done
echo "registry structure valid"
'''

[tasks.test]
description = "Run the registry contract for every declared template"
run = "mise run template-test"

[tasks.format]
description = "Format registry and template files"
run = '''
mise fmt
bun run format
'''

[tasks."format:check"]
description = "Check registry and template formatting"
run = '''
mise fmt --check
bun run format:check
'''

[tasks.lint]
description = "Validate registry configuration"
run = '''
set -eu
mise fmt --check
[ -f premise.yaml ] || { echo "error: missing premise.yaml" >&2; exit 1; }
bun run lint
echo "registry config valid"
'''

[tasks.clean]
description = "Remove generated Bun artifacts"
run = '''
find templates apps libs -type d \( -name node_modules -o -name dist -o -name .output -o -name .svelte-kit -o -name build -o -name coverage \) -prune -exec rm -rf {} + 2>/dev/null || true
find templates apps libs -name bun.lock -type f -delete 2>/dev/null || true
'''
